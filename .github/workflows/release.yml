# Creates a GitHub release automatically whenever a push contains a module.json
# version that has no release yet. Foundry's Update button then picks it up.
# To ship an update: bump "version" in module.json and push.
name: Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r .version module.json)
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set URLs in module.json
        if: steps.check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.check.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg m "https://github.com/$REPO/releases/latest/download/module.json" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.manifest = $m | .download = $d' module.json > module.tmp
          mv module.tmp module.json

      - name: Build module.zip
        if: steps.check.outputs.skip == 'false'
        run: |
          paths=()
          for p in module.json README.md LICENSE scripts lang styles templates assets packs; do
            [ -e "$p" ] && paths+=("$p")
          done
          zip -r module.zip "${paths[@]}"

      - name: Create release
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          git log -1 --pretty=%B > notes.md
          gh release create "$TAG" module.json module.zip \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md --latest
